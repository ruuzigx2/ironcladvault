name: Release APK

# Runs when the 'ironclad-release' branch is updated. The version comes from version.properties.
on:
  push:
    branches: [ironclad-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Read version
        run: |
          MA=$(grep '^VERSION_MAJOR=' version.properties | cut -d= -f2 | tr -d ' \r')
          MI=$(grep '^VERSION_MINOR=' version.properties | cut -d= -f2 | tr -d ' \r')
          PA=$(grep '^VERSION_PATCH=' version.properties | cut -d= -f2 | tr -d ' \r')
          echo "TAG=v$MA.$MI.$PA" >> "$GITHUB_ENV"
      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released - nothing to publish. Raise the version to publish a new release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check signing secrets are present
        if: steps.exists.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing or empty"; exit 1; fi
          done
      - name: Decode keystore
        if: steps.exists.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r\t')
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" || { echo "::error::KEYSTORE_BASE64 is not complete base64 text"; exit 1; }
      - name: Build signed release APK
        if: steps.exists.outputs.skip != 'true'
        env:
          ENCLY_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ENCLY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ENCLY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ENCLY_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleFdroidRelease
      - name: Verify signature and rename
        if: steps.exists.outputs.skip != 'true'
        run: |
          APK=$(ls app/build/outputs/apk/fdroid/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          cp "$APK" "ironclad-vault-${TAG}.apk"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish GitHub release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" "ironclad-vault-${TAG}.apk" \
            --title "Ironclad Vault ${TAG}" \
            --notes "Ironclad Vault ${TAG}. A modified version of Encly by pasichDev, licensed under the Apache License 2.0; source code is in this repository."
